name: playlist_admin
description: playlist-admin - Music library management & Spotube automation
publish_to: 'none'
version: 3.0.0-beta.1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  http: ^1.1.0
  http_parser: ^4.0.2
  html: ^0.15.4
  win32: ^5.9.0
  fl_chart: ^0.66.0
  ffi: ^2.1.0
  audioplayers: ^6.1.0
  file_picker: ^11.0.3
  path_provider: ^2.1.0
  webview_windows:
    path: vendor/webview_windows
  media_kit: ^1.2.6
  media_kit_libs_audio: ^1.0.7
  youtube_explode_dart: ^3.1.0
  logger: ^2.7.0
  discord_rich_presence: ^1.1.1
  qr_flutter: ^4.1.0
  xml: ^6.6.1
  cached_network_image: ^3.4.1

  path: any
  crypto: any
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.1

flutter:
  uses-material-design: true
  assets:
    - assets/zhcdict.json
    - assets/tools/
    - assets/tools/rag/
