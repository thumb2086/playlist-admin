name: NPM Publish

# npm Trusted Publishing (OIDC)：無 token，npmjs.com → playlist-admin → Trusted Publisher
# 綁 thumb2086/playlist-admin + 本檔。要求：id-token: write、Node >= 22.14、npm >= 11.5.1。
permissions:
  contents: read
  id-token: write

on:
  push:
    tags:
      - 'v*'

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'

      # OIDC 發佈需要 npm >= 11.5.1；pin 最低需求版，不追 npm@latest（曾有 broken release）。
      - name: Upgrade npm for OIDC (>= 11.5.1)
        run: npm install -g npm@11.5.1 && npm --version

      - name: Set version from tag
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"

      - name: Bump package.json version
        run: node -e "var p=JSON.parse(require('fs').readFileSync('package.json'));p.version=process.env.VERSION;require('fs').writeFileSync('package.json',JSON.stringify(p,null,2)+'\n')"

      - name: Publish to npm
        run: |
          if npm view playlist-admin@$VERSION version 2>/dev/null; then
            echo "playlist-admin@$VERSION already published, skipping"
          else
            npm publish --access public
          fi

      - name: Smoke test
        run: |
          sleep 10
          npm install -g playlist-admin
          playlist-admin
