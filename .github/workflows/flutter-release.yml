name: Flutter Build & Release

permissions:
  contents: write

on:
  push:
    branches: [main]
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  # =====================================================================
  # Android APK（手機版）
  # =====================================================================
  android:
    name: Android APK
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash

    steps:
      - uses: actions/checkout@v4

      # rag/ 是唯一真相來源：release 打包的是 assets/tools/rag/，
      # 每次 build 前強制同步，歷史分叉不再發生。
      - name: Sync rag scripts into assets
        run: |
          mkdir -p assets/tools/rag
          cp rag/build_db.py rag/_resolve.py rag/query.py rag/srt_to_text.py rag/study_build.py rag/study_query.py assets/tools/rag/
          cp tools/flutter_download_bridge.py assets/tools/flutter_download_bridge.py
          mkdir -p assets/skills
          cp -r .opencode/skills/* assets/skills/

      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Get version & channel
        id: info
        run: |
          if [ "${{ github.ref_type }}" = "tag" ]; then
            version="${GITHUB_REF_NAME#v}"
            [ -n "$version" ] || version=3.0.0-beta.1
            if echo "$version" | grep -qi "beta\|alpha\|rc\|dev"; then
              echo "CHANNEL=beta" >> "$GITHUB_ENV"
              echo "PRERELEASE=true" >> "$GITHUB_ENV"
            else
              echo "CHANNEL=stable" >> "$GITHUB_ENV"
              echo "PRERELEASE=false" >> "$GITHUB_ENV"
            fi
          else
            version=$(sed -n 's/^version: *\(.*\)/\1/p' pubspec.yaml)
            [ -n "$version" ] || version=0.0.0-dev
            echo "CHANNEL=dev" >> "$GITHUB_ENV"
            echo "PRERELEASE=true" >> "$GITHUB_ENV"
          fi
          echo "APP_VERSION=$version" >> "$GITHUB_ENV"
          # Android versionCode 必須是遞增整數：v2.15.44 → 2015044。
          # （apk 覆蓋安裝靠它判斷新舊；pubspec 版號只給桌面看。）
          nums=$(echo "$version" | grep -oE '[0-9]+' | head -3)
          major=$(echo "$nums" | sed -n '1p'); minor=$(echo "$nums" | sed -n '2p'); patch=$(echo "$nums" | sed -n '3p')
          [ -n "$major" ] || major=0; [ -n "$minor" ] || minor=0; [ -n "$patch" ] || patch=0
          echo "BUILD_NUMBER=$((major * 1000000 + minor * 1000 + patch))" >> "$GITHUB_ENV"

      - run: flutter pub get

      - name: Analyze
        if: github.ref_type != 'tag'
        run: flutter analyze --no-fatal-infos --no-fatal-warnings || true

      - name: Build APK (release, universal single package)
        # 只打一包 universal（app-release.apk）：手機直接裝、in-app 更新鏈也吃它。
        # split-per-abi 三包已砍（舊機型本來就沒人用，多包只會讓人裝錯）。
        run: flutter build apk --release --dart-define=APP_VERSION=$APP_VERSION --build-number=$BUILD_NUMBER

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: playlist-admin-apk-${{ env.CHANNEL }}
          path: build/app/outputs/flutter-apk/*.apk

      - name: Attach APK to GitHub Release
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@v2
        with:
          name: "playlist-admin v${{ env.APP_VERSION }}"
          prerelease: ${{ env.PRERELEASE }}
          files: build/app/outputs/flutter-apk/*.apk
        env:
          GITHUB_TOKEN: ${{ github.token }}

  # =====================================================================
  # Windows 桌面版
  # =====================================================================
  build:
    runs-on: windows-2022
    defaults:
      run:
        shell: pwsh

    steps:
      - uses: actions/checkout@v4

      # rag/ 是唯一真相來源：release 打包的是 assets/tools/rag/，
      # 每次 build 前強制同步，歷史分叉不再發生。
      - name: Sync rag scripts into assets
        run: |
          New-Item -ItemType Directory -Force -Path assets/tools/rag | Out-Null
          Copy-Item rag/build_db.py,rag/_resolve.py,rag/query.py,rag/srt_to_text.py,rag/study_build.py,rag/study_query.py assets/tools/rag/ -Force
          Copy-Item tools/flutter_download_bridge.py assets/tools/flutter_download_bridge.py -Force
          New-Item -ItemType Directory -Force -Path assets/skills | Out-Null
          Copy-Item .opencode/skills/* assets/skills/ -Recurse -Force

      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          architecture: x64
          cache: true

      - name: Get version & channel
        id: info
        run: |
          if ("${{ github.ref_type }}" -eq "tag") {
            $tag = "${{ github.ref_name }}"
            $version = $tag -replace '^v', ''
            if (-not $version) { $version = '3.0.0-beta.1' }
            if ($version -match '(?i)(beta|alpha|rc|dev)') {
              "CHANNEL=beta" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
              "PRERELEASE=true" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
            } else {
              "CHANNEL=stable" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
              "PRERELEASE=false" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
            }
          } else {
            $yaml = Get-Content pubspec.yaml | Select-String '^version: (.+)'
            $version = $yaml.Matches.Groups[1].Value
            if (-not $version) { $version = '0.0.0-dev' }
            "CHANNEL=dev" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
            "PRERELEASE=true" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          }
          "APP_VERSION=$version" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - run: flutter pub get

      - name: Analyze
        if: github.ref_type != 'tag'
        run: flutter analyze --no-fatal-infos --no-fatal-warnings || true

      - name: Build Windows
        if: github.ref_type == 'tag'
        run: flutter build windows --release --dart-define=APP_VERSION=$env:APP_VERSION

      - name: Install Inno Setup
        if: github.ref_type == 'tag'
        run: choco install innosetup --no-progress -y

      - name: Build installer
        if: github.ref_type == 'tag'
        run: |
          # GUI 安裝包內附 opencode skill（鬆散檔，給 playlist-admin skill install 用）
          New-Item -ItemType Directory -Force -Path build\windows\x64\runner\Release\skills | Out-Null
          Copy-Item .opencode/skills/* build\windows\x64\runner\Release\skills\ -Recurse -Force
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" "/DMyAppVersion=$env:APP_VERSION" "installer\PlaylistAdministrator.iss"

      - name: Upload artifact
        if: github.ref_type == 'tag'
        uses: actions/upload-artifact@v4
        with:
          name: playlist-admin-Setup-${{ env.CHANNEL }}
          path: installer\playlist-admin-Setup-*.exe

      - name: Release
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@v2
        with:
          name: "playlist-admin v${{ env.APP_VERSION }}"
          prerelease: ${{ env.PRERELEASE }}
          files: installer\playlist-admin-Setup-*.exe
        env:
          GITHUB_TOKEN: ${{ github.token }}
